<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Atendimento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/admin.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4 px-3">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Painel do Gerente</span>
        <button onclick="fazerLogout()" class="btn btn-outline-light btn-sm">Sair</button>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-3">
            <div class="card shadow-sm mb-3">
                <div class="card-header bg-secondary text-white">
                    Fila de Espera (<span id="contador-fila">0</span>)
                </div>
                <ul class="list-group list-group-flush queue-list" id="lista-espera-container">
                    <li class="list-group-item text-center text-muted">Carregando fila...</li>
                </ul>
            </div>
        </div>

        <div class="col-md-9">
            <h4 class="mb-3 pb-2 border-bottom">Mesas em Tempo Real</h4>
            <div class="row g-3" id="mesas-container">
                <div class="col-12 text-center text-muted mt-5">
                    Procurando mesas ativas...
                </div>
            </div>

            <div class="row mt-5">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">📊 Relatório de Atendimentos</h5>
                            <div>
                                <button onclick="baixarCsv()" class="btn btn-success btn-sm me-2 fw-bold">
                                    📥 Baixar CSV
                                </button>
                                <button onclick="carregarRelatorio()" class="btn btn-light btn-sm text-primary fw-bold">
                                    🔄 Atualizar Lista
                                </button>
                            </div>
                        </div>
                        <div class="card-body" id="painel-relatorio" style="display: none;">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover align-middle">
                                    <thead class="table-light">
                                    <tr>
                                        <th>Senha</th>
                                        <th>Cliente</th>
                                        <th>Mesa/Atendente</th>
                                        <th>Tipo</th>
                                        <th>Data/Hora</th>
                                    </tr>
                                    </thead>
                                    <tbody id="corpo-tabela-relatorio">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="./js/admin.js"></script>
</body>
</html>
