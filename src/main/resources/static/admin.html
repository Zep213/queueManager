<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Atendimento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/admin.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Painel do Gerente</span>
        <button class="btn btn-outline-light btn-sm">Sair</button>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">

        <div class="col-md-3">
            <div class="card shadow-sm mb-3">
                <div class="card-header bg-secondary text-white">
                    Fila de Espera (<span id="contador-fila">0</span>)
                </div>
                <ul class="list-group list-group-flush" id="lista-espera-container">
                    <li class="list-group-item text-center text-muted">Carregando fila...</li>
                </ul>
            </div>
        </div>

        <div class="col-md-9">
            <h4 class="mb-3 pb-2 border-bottom">Mesas em Tempo Real</h4>

            <div class="row g-3" id="mesas-container">
                <div class="col-12 text-center text-muted mt-5">
                    Procurando mesas ativas...
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="./js/admin.js"></script>
</body>
</html>
