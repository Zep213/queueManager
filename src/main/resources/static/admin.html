<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Atendimento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/admin.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4 px-3">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Painel do Gerente</span>
        <div class="d-flex gap-2">
            <button onclick="abrirGestaoUsuarios()" class="btn btn-outline-info btn-sm">
                👥 Gerenciar Acessos
            </button>
        <button onclick="fazerLogout()" class="btn btn-outline-light btn-sm">Sair</button>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-3">
            <div class="card shadow-sm mb-3">
                <div class="card-header bg-secondary text-white">
                    Fila de Espera (<span id="contador-fila">0</span>)
                </div>
                <ul class="list-group list-group-flush queue-list" id="lista-espera-container">
                    <li class="list-group-item text-center text-muted">Carregando fila...</li>
                </ul>
            </div>
        </div>

        <div class="col-md-9">
            <h4 class="mb-3 pb-2 border-bottom">Mesas em Tempo Real</h4>
            <div class="row g-3" id="mesas-container">
                <div class="col-12 text-center text-muted mt-5">
                    Procurando mesas ativas...
                </div>
            </div>

            <div class="row mt-5">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">📊 Relatório de Atendimentos</h5>
                            <div>
                                <button onclick="baixarCsv()" class="btn btn-success btn-sm me-2 fw-bold">
                                    📥 Baixar CSV
                                </button>
                                <button onclick="carregarRelatorio()" class="btn btn-light btn-sm text-primary fw-bold">
                                    🔄 Atualizar Lista
                                </button>
                            </div>
                        </div>
                        <div class="card-body" id="painel-relatorio" style="display: none;">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover align-middle">
                                    <thead class="table-light">
                                    <tr>
                                        <th>Senha</th>
                                        <th>Cliente</th>
                                        <th>Mesa/Atendente</th>
                                        <th>Tipo</th>
                                        <th>Data/Hora</th>
                                    </tr>
                                    </thead>
                                    <tbody id="corpo-tabela-relatorio">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
<div class="modal fade" id="modalUsuarios" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Gerenciar Equipe e Acessos</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">

                <div class="card mb-4 bg-light border-0">
                    <div class="card-body">
                        <h6 class="card-title mb-3">Novo Usuário</h6>
                        <form id="formUsuario" class="row g-2 align-items-end">
                            <div class="col-md-4">
                                <label class="form-label small">Login</label>
                                <input type="text" class="form-control form-control-sm" id="novoLogin" placeholder="Ex: banca_tcc" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small">Senha</label>
                                <input type="password" class="form-control form-control-sm" id="novaSenha" placeholder="******" required>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label small">Perfil</label>
                                <select class="form-select form-select-sm" id="novoPerfil">
                                    <option value="USER">Atendente</option>
                                    <option value="ADMIN">Gerente</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <button type="submit" class="btn btn-primary btn-sm w-100">Salvar</button>
                            </div>
                        </form>
                    </div>
                </div>

                <h6 class="mb-2">Usuários Cadastrados</h6>
                <table class="table table-sm table-hover">
                    <thead class="table-light">
                    <tr>
                        <th>Login</th>
                        <th>Perfil</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody id="lista-usuarios">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="./js/admin.js"></script>
</body>
</html>
