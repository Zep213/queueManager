<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retirar Senha</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="container ticket-card">
  <h2 class="mb-3 fw-bold text-primary">Bem-vindo</h2>
  <p class="text-muted mb-4">Preencha seu nome e retire sua senha</p>

  <div class="mb-4 text-start">
    <label for="inputNome" class="form-label fw-bold">Seu Nome</label>
    <input type="text" class="form-control form-control-lg" id="inputNome" placeholder="Digite seu nome...">
  </div>

  <button onclick="gerarSenha('NORMAL')" class="btn btn-primary btn-ticket shadow-sm">
    👤 Normal
  </button>

  <button onclick="gerarSenha('PRIORITARIO')" class="btn btn-warning text-white btn-ticket shadow-sm">
    ♿ Prioritário
  </button>

  <div id="painel-fila" class="alert alert-info mt-3 shadow-sm" role="alert">
    <h5 id="info-fila" class="mb-1">Calculando fila...</h5>
    <small class="text-muted">Tempo médio por pessoa: 10 min</small>
  </div>
  <div id="ticket-result">
    <p class="mb-0 text-muted">Sua senha:</p>
    <div class="big-number" id="numero-senha">---</div>
    <p id="nome-exibido" class="fw-bold text-dark mt-2"></p>
    <p class="small text-muted">Aguarde ser chamado.</p>
  </div>
</div>

<a href="/admin.html" class="admin-link">⚙️ Área Restrita</a>

<script src="js/totem.js"></script>
</body>
</html>
