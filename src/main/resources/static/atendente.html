<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Atendimento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-light fixed-top shadow-sm px-4 bg-white">
    <a class="navbar-brand mb-0 h1 fw-bold text-primary" href="index.html">
        QueueManager <span class="badge bg-primary text-white fs-6">Mesa</span>
    </a>

    <div class="d-flex gap-2">
        <button class="btn btn-outline-primary btn-sm" onclick="abrirHistorico()">📜 Histórico</button>
        <a href="/logout" class="btn btn-outline-danger btn-sm">Sair</a>
    </div>
</nav>

<div class="container" style="margin-top: 80px;">
    <div class="painel-container">

        <div class="row">
            <div class="col-12">
                <h4 class="text-muted mb-3">Em Atendimento Agora</h4>
                <div class="card shadow-sm border-0">
                    <div class="card-body text-center py-5">
                        <h1 class="display-3 fw-bold text-primary" id="atual-numero">---</h1>
                        <h3 class="text-dark" id="atual-nome">Sem atendimento</h3>
                        <div class="mt-3">
                            <span class="badge bg-secondary fs-5" id="atual-tipo">-</span>
                        </div>

                        <div class="mt-5 d-flex justify-content-center gap-3">
                            <button onclick="chamarProximo()" class="btn btn-success btn-lg px-5 shadow">
                                📢 Chamar Próximo
                            </button>
                            <button onclick="finalizarAtual()" class="btn btn-outline-secondary btn-lg">
                                ✅ Finalizar
                            </button>
                            <button onclick="realizarPausa()" class="btn btn-sm btn-outline-secondary mt-3">
                                ☕ Pausar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <hr class="my-5">

        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="text-muted">Fila de Espera</h4>
                    <div class="d-flex gap-2">
                        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modalAvulso">
                            ➕ Novo Avulso
                        </button>
                        <button onclick="carregarFila()" class="btn btn-sm btn-link text-decoration-none">Atualizar Lista</button>
                    </div>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th class="ps-3">Senha</th>
                                <th>Nome</th>
                                <th>Tipo</th>
                                <th>Chegada</th>
                                <th class="text-end pe-3">Ações</th>
                            </tr>
                            </thead>
                            <tbody id="lista-espera">
                            <tr><td colspan="5" class="text-center text-muted py-3">A carregar...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalAvulso" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Cadastrar Atendimento Avulso</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formAvulso">
                    <div class="mb-3">
                        <label for="nomeAvulso" class="form-label">Nome do Cliente</label>
                        <input type="text" class="form-control" id="nomeAvulso" placeholder="Ex: Sr. Manuel" required>
                    </div>
                    <p class="text-muted small">
                        A senha será gerada automaticamente com o prefixo <strong>"A"</strong>.
                    </p>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="criarTicketAvulso()">Confirmar</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalHistorico" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header bg-light d-flex justify-content-between align-items-center">
                <h5 class="modal-title">Histórico de Atendimentos</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <table class="table table-striped table-sm">
                    <thead>
                    <tr>
                        <th>Senha</th>
                        <th>Nome</th>
                        <th>Tipo</th>
                        <th>Mesa</th>
                        <th>Hora</th>
                    </tr>
                    </thead>
                    <tbody id="tabela-historico">
                    </tbody>
                </table>
            </div>
            <div class="modal-footer bg-light d-flex justify-content-between">
                <div>
                    <button onclick="baixarHistoricoCsv()" class="btn btn-success btn-sm me-2">📥 Baixar CSV</button>
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="js/atendente.js"></script> </body>
</html>
