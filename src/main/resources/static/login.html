<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - QueueManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="container ticket-card" style="max-width: 400px;">
    <h2 class="mb-4 fw-bold text-primary">Acesso Restrito</h2>

    <div th:if="${param.error}" class="alert alert-danger" role="alert">
        Usuário ou senha inválidos.
    </div>

    <form action="/login" method="post">
        <div class="mb-3 text-start">
            <label for="username" class="form-label fw-bold">Usuário</label>
            <input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="Ex: guiche01" required autofocus>
        </div>

        <div class="mb-4 text-start">
            <label for="password" class="form-label fw-bold">Senha</label>
            <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="******" required>
        </div>

        <button type="submit" class="btn btn-primary btn-ticket shadow-sm">
            Entrar
        </button>
    </form>

    <div class="mt-3 text-muted small">
        <a href="/" class="text-decoration-none">← Voltar ao Totem</a>
    </div>
</div>

</body>
</html>
