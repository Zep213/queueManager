spring.application.name=queueManager

# CORS: defina o domínio real em produção ou via variável APP_CORS_ALLOWED_ORIGINS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080}

# Credenciais dos usuários iniciais — sobrescreva via variáveis de ambiente em produção
app.admin.username=${ADMIN_USERNAME:#AdminFodao2136#}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}
app.atendente.username=${ATENDENTE_USERNAME:atendente}
app.atendente.password=${ATENDENTE_PASSWORD:ChangeMe123!}

# Chave de assinatura dos tokens JWT — obrigatória, sem valor padrão (defina JWT_SECRET no .env)
jwt.secret=${JWT_SECRET}

# Repare que n�o tem a palavra "data"
spring.mongodb.uri=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@queue-mongo:27017/sistema-fila?authSource=admin

# Tempo estimado de atendimento por pessoa (minutos)
app.atendimento.minutos-por-pessoa=10

logging.level.root=INFO
logging.level.com.umari=DEBUG