version: '3.8'

services:
  queue-mongo:
    image: mongo:7.0
    container_name: queue-mongo
    volumes:
      - mongo_data:/data/db
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: .
    container_name: queue-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      queue-mongo:
        condition: service_healthy
    restart: always

volumes:
  mongo_data:
